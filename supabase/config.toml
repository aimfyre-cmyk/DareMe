
[functions.transition-dare]
enabled = true
verify_jwt = false
import_map = "./functions/transition-dare/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/transition-dare/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/transition-dare/*.html" ]

[functions.r2-upload-url]
enabled = true
# Auth is enforced inside the function via withSupabase({ auth: "user" }).
verify_jwt = false
import_map = "./functions/r2-upload-url/deno.json"
entrypoint = "./functions/r2-upload-url/index.ts"

[functions.r2-media-url]
enabled = true
# Auth is enforced inside the function via withSupabase({ auth: "user" }).
verify_jwt = false
import_map = "./functions/r2-media-url/deno.json"
entrypoint = "./functions/r2-media-url/index.ts"
